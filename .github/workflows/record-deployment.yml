name: Record Deployment

on:
    push:
        branches: [production]

jobs:
    record:
        runs-on: ubuntu-latest
        permissions:
            deployments: write
            contents: read
        steps:
            - name: Start deployment record (Production)
              id: start
              uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
              with:
                  step: start
                  token: ${{ secrets.GITHUB_TOKEN }}
                  env: Production
                  ref: ${{ github.ref }}

            - name: Mark deployment successful (Production)
              if: always()
              uses: bobheadxi/deployments@648679e8e4915b27893bd7dbc35cb504dc915bc8 # v1.5.0
              with:
                  step: finish
                  token: ${{ secrets.GITHUB_TOKEN }}
                  env: Production
                  status: ${{ job.status }}
                  deployment_id: ${{ steps.start.outputs.deployment_id }}
                  env_url: https://zkm.tw/
