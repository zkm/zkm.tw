name: Coverage

# Publishes line coverage on master as a shields.io endpoint file on the orphan `badges` branch,
# which the README's coverage badge reads. Nothing but this workflow should write to `badges`.

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: coverage-badge
    cancel-in-progress: true

jobs:
    coverage:
        name: Coverage badge
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'yarn'

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable

            - name: Coverage
              run: yarn test:coverage

            - name: Badge file
              run: |
                  node -e '
                    const pct = require("./coverage/coverage-summary.json").total.lines.pct;
                    const color = pct >= 90 ? "brightgreen" : pct >= 80 ? "green" : pct >= 70 ? "yellowgreen"
                      : pct >= 60 ? "yellow" : pct >= 50 ? "orange" : "red";
                    const badge = { schemaVersion: 1, label: "coverage", message: `${Math.floor(pct)}%`, color };
                    require("fs").writeFileSync("coverage-badge.json", JSON.stringify(badge) + "\n");
                  '
                  cat coverage-badge.json
                  echo "Line coverage: $(jq -r .message coverage-badge.json)" >> "$GITHUB_STEP_SUMMARY"

            # A single commit, built without touching the checkout, replaces the branch each time.
            - name: Publish to the badges branch
              env:
                  GIT_AUTHOR_NAME: github-actions[bot]
                  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
                  GIT_COMMITTER_NAME: github-actions[bot]
                  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
              run: |
                  if git fetch -q --depth=1 origin badges && git show FETCH_HEAD:coverage.json | cmp -s - coverage-badge.json; then
                    echo "Coverage unchanged; nothing to publish"
                    exit 0
                  fi
                  blob=$(git hash-object -w coverage-badge.json)
                  tree=$(printf '100644 blob %s\tcoverage.json\n' "$blob" | git mktree)
                  commit=$(git commit-tree "$tree" -m "Coverage $(jq -r .message coverage-badge.json) at ${GITHUB_SHA::7}")
                  git push -f origin "$commit:refs/heads/badges"
