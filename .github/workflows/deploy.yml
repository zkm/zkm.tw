name: Deploy

# Push a v* tag on master to release and deploy it:  git tag v4.1.0 && git push origin v4.1.0
# The tag must match the version in package.json.
# Roll back: Actions -> Deploy -> Run workflow, and pick an earlier tag under "Use workflow from".
# docs/deploy.md has the DigitalOcean and GitHub setup.
#
# App Platform can only build the tip of a branch, so deploying a tag means moving the `release`
# branch to it and asking DigitalOcean for a deployment. DigitalOcean builds the source itself;
# the dist tarball on the GitHub Release is a record of what that tag builds to.

on:
    push:
        tags: ['v*']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    tests:
        name: Tests
        if: github.event_name == 'push'
        uses: ./.github/workflows/ci.yml

    build:
        name: Build release
        if: github.event_name == 'push'
        needs: tests
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            TAG: ${{ github.ref_name }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: The tag is the package.json version on master
              run: |
                  if ! [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::$TAG is not vX.Y.Z"; exit 1; fi
                  version=$(node -p 'require("./package.json").version')
                  if [ "$TAG" != "v$version" ]; then echo "::error::$TAG does not match package.json ($version)"; exit 1; fi
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then echo "::error::$TAG is not on master"; exit 1; fi

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version-file: '.nvmrc'
                  cache: 'yarn'

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --immutable

            - name: Build
              run: |
                  yarn build
                  tar -czf "zkm.tw-$TAG.tar.gz" -C dist .
                  sha256sum "zkm.tw-$TAG.tar.gz" > "zkm.tw-$TAG.tar.gz.sha256"

            # A pre-release until the deploy succeeds. Rerunning replaces the files.
            - name: Save on the GitHub Release
              run: |
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    gh release upload "$TAG" "zkm.tw-$TAG.tar.gz" "zkm.tw-$TAG.tar.gz.sha256" --clobber
                  else
                    gh release create "$TAG" "zkm.tw-$TAG.tar.gz" "zkm.tw-$TAG.tar.gz.sha256" \
                      --verify-tag --prerelease --generate-notes --title "$TAG"
                  fi

    deploy:
        name: Deploy to production
        needs: build
        # Runs after a build, or on its own for a rollback (build is skipped then).
        if: ${{ !cancelled() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped')) }}
        runs-on: ubuntu-latest
        # Secrets live on this environment, which only v* tags may use and which waits for approval.
        environment:
            name: production
            url: https://zkm.tw/
        concurrency:
            group: deploy-production
            cancel-in-progress: false
        permissions:
            contents: write
        env:
            TAG: ${{ github.ref_name }}
            GH_TOKEN: ${{ github.token }}
            APP_ID: ${{ vars.DO_APP_ID }}
        steps:
            - name: Only tags deploy
              run: |
                  if [ "$GITHUB_REF_TYPE" != tag ]; then echo "::error::Pick a tag under 'Use workflow from', not a branch"; exit 1; fi
                  if [ -z "$APP_ID" ]; then echo "::error::The production environment has no DO_APP_ID variable"; exit 1; fi

            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            # The app builds `release`. A force push, because a rollback moves it backwards.
            - name: Move the release branch to the tag
              run: git push --force origin "$GITHUB_SHA:refs/heads/release"

            # no_auth: `doctl auth init` checks the token against /v2/account, which needs
            # account:read. The token is scoped to apps only, so doctl reads it from the env instead.
            - uses: digitalocean/action-doctl@v2
              with:
                  no_auth: true

            # create-deployment --wait returns when the deployment ends, whether or not it succeeded,
            # so check that it went live and that DigitalOcean built the tag's commit.
            - name: Deploy
              env:
                  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
              run: |
                  id=$(doctl apps create-deployment "$APP_ID" --force-rebuild --wait --format ID --no-header)
                  doctl apps get-deployment "$APP_ID" "$id" -o json > deployment.json
                  phase=$(jq -r '.[0].phase' deployment.json)
                  commit=$(jq -r '.[0].static_sites[0].source_commit_hash' deployment.json)
                  echo "Deployment $id: $phase, commit $commit"
                  if [ "$phase" != ACTIVE ]; then echo "::error::Deployment $id ended $phase. The previous deployment is still live."; exit 1; fi
                  if [ "$commit" != "$GITHUB_SHA" ]; then echo "::error::Deployment $id built $commit, not $TAG ($GITHUB_SHA)"; exit 1; fi

            - name: Mark the release as deployed
              if: github.event_name == 'push'
              run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
