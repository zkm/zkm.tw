name: 'CodeQL Analysis'

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Run at 6:00 AM UTC every Monday
        - cron: '0 6 * * 1'
    workflow_dispatch:

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ['javascript']

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
              with:
                  languages: ${{ matrix.language }}
                  queries: +security-extended,security-and-quality

            - name: Autobuild
              uses: github/codeql-action/autobuild@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
              with:
                  category: '/language:${{ matrix.language }}'
