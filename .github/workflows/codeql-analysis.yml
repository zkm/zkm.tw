name: 'CodeQL Analysis'

on:
    push:
        branches: [main, master, develop]
    pull_request:
        branches: [main, master, develop]
    schedule:
        # Run at 6:00 AM UTC every Monday
        - cron: '0 6 * * 1'
    workflow_dispatch:

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ['javascript']

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  languages: ${{ matrix.language }}
                  queries: +security-extended,security-and-quality

            - name: Autobuild
              uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  category: '/language:${{ matrix.language }}'
