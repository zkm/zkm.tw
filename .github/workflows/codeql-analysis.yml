name: 'CodeQL Analysis'

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        # Run at 6:00 AM UTC every Monday
        - cron: '0 6 * * 1'
    workflow_dispatch:

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ['javascript']

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Initialize CodeQL
              uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  languages: ${{ matrix.language }}
                  queries: +security-extended,security-and-quality

            - name: Autobuild
              uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
              with:
                  category: '/language:${{ matrix.language }}'
