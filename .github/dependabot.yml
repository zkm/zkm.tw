version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '07:00'
          timezone: 'America/Chicago'
      labels:
          - 'dependencies'
      open-pull-requests-limit: 5
      rebase-strategy: 'disabled'
      groups:
          production-dependencies:
              dependency-type: 'production'
              patterns:
                  - '*'
          development-dependencies:
              dependency-type: 'development'
              patterns:
                  - '*'

    # The chat worker is its own Yarn project with its own lockfile
    - package-ecosystem: 'npm'
      directory: '/workers/chat'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '07:15'
          timezone: 'America/Chicago'
      labels:
          - 'dependencies'
      open-pull-requests-limit: 5
      rebase-strategy: 'disabled'
      groups:
          worker-dependencies:
              patterns:
                  - '*'

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'weekly'
          day: 'monday'
          time: '07:30'
          timezone: 'America/Chicago'
      labels:
          - 'dependencies'
      groups:
          codeql-action:
              patterns:
                  - 'github/codeql-action*'
